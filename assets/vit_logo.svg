<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <g transform="translate(10, 5)">
    <!-- VIT Emblem / Shield -->
    <g transform="translate(20, 2)">
      <!-- Outer Shield / Circle -->
      <circle cx="20" cy="20" r="19" fill="#003366" stroke="#c59b27" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="16" fill="#ffffff"/>
      <!-- Inner Design -->
      <path d="M10 24 L20 10 L30 24 Z" fill="#003366"/>
      <circle cx="20" cy="18" r="4" fill="#c59b27"/>
      <path d="M12 26 C15 32 25 32 28 26 C24 29 16 29 12 26 Z" fill="#003366"/>
      <!-- Ribbon text curve -->
      <path d="M8 28 Q20 36 32 28" stroke="#003366" stroke-width="1.5" fill="none"/>
