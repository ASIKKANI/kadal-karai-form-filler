      <circle cx="20" cy="8" r="1.5" fill="#c59b27"/>
    </g>
    
    <!-- VIT Text -->
    <text x="75" y="32" font-family="'Times New Roman', serif, Arial" font-size="34" font-weight="900" fill="#003366" letter-spacing="2">VIT</text>
    <text x="76" y="47" font-family="'Arial', 'Helvetica Neue', sans-serif" font-size="12" font-weight="700" fill="#003366" letter-spacing="4.5">CHENNAI</text>
  </g>
